name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Design tokens
        run: uv run python scripts/lint_design_tokens.py --strict

      - name: Python syntax
        run: uv run python -m compileall -q app.py run.py src scripts

      - name: Python lint
        run: uv run ruff check src run.py scripts/import_statements.py

      - name: Package type check
        run: uv run mypy src

      - name: Frontend syntax
        run: node --check static/app.js

      - name: Tests
        run: uv run pytest -q

      - name: Build distribution
        run: uv build
