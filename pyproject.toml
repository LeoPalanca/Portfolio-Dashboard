[project]
name = "portfolio-dashboard"
version = "0.6.5"
description = "A local-first dashboard for consolidating brokerage and cash-account data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["portfolio", "finance", "dashboard", "sqlite", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "flask>=3.1,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.12,<3",
    "pyjwt[crypto]>=2.10,<3",
    "reportlab>=4.4,<5",
    "yfinance>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/LeoPalanca/portfolio-dashboard"
Repository = "https://github.com/LeoPalanca/portfolio-dashboard.git"
Issues = "https://github.com/LeoPalanca/portfolio-dashboard/issues"
Changelog = "https://github.com/LeoPalanca/portfolio-dashboard/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_dashboard"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
